services:
  rankroom:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rankroom
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - rankroom_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  rankroom_data:
    driver: local
